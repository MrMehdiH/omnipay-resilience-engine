name: OmniPay Quality Gate CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-architecture:
    name: Typecheck, Lint, Vitest & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Verify Zero-Any TypeScript Contract
        run: npx tsc --noEmit

      - name: 🧹 Run ESLint Checks
        run: npm run lint

      - name: 🧪 Execute Deterministic Vitest Suite (10/10)
        run: npx vitest run

      - name: 🏗️ Verify Next.js Production Build
        run: npm run builds